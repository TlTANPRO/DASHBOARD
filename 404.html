<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syahfalah OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234f46e5'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='16' font-weight='700' fill='white'%3ESY%3C/text%3E%3C/svg%3E">
  <script>
    // Catch-all for /DASHBOARD/pic/P2, /DASHBOARD/jobdesk, etc.
    // GH Pages static: any path that doesn't match a file falls to 404.html.
    // We rewrite the URL to root with the original path as query, then
    // index.html parses it on boot and dispatches the correct route.
    (function () {
      var path = window.location.pathname;
      // Strip the GH Pages base (e.g. /DASHBOARD)
      var m = path.match(/^\/[^\/]+(\/.*)?$/);
      var tail = (m && m[1]) ? m[1] : '';
      // Build canonical URL: /DASHBOARD/?r=/pic/P2
      var base = path.replace(tail, '') || '/';
      window.location.replace(base + '?r=' + encodeURIComponent(tail || '/'));
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=./">
  </noscript>
</head>
<body>
  <p>Memuat ulang...</p>
</body>
</html>
